<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16232B">
<title>Levantamiento de Patio — HT Rent</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#E9EAE5; --panel:#FFFFFF; --panel2:#F4F5F1;
  --ink:#11181D; --muted:#63707A; --line:#D3D8D2;
  --amber:#E08A00; --amber-soft:#FDF1DC;
  --steel:#16232B; --steel-2:#22333D;
  --ok:#17795A; --ok-soft:#E2F2EB;
  --bad:#B3261E; --bad-soft:#FBE7E5;
  --warn:#B45309;
  --r:10px;
  --display:ui-sans-serif,"Archivo Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Roboto Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.45;padding-bottom:86px;
  overscroll-behavior-y:contain;
}
.wrap{max-width:600px;margin:0 auto;padding:0 12px}

/* ---------- Encabezado: banda de cinta reflejante ---------- */
header{background:var(--steel);color:#fff;position:sticky;top:0;z-index:40}
.tape{height:8px;background:repeating-linear-gradient(115deg,var(--amber) 0 14px,#2B3A44 14px 28px)}
.hbar{display:flex;align-items:center;gap:10px;padding:10px 12px;max-width:600px;margin:0 auto}
.hbar h1{font-family:var(--display);font-size:15px;letter-spacing:.10em;text-transform:uppercase;margin:0;font-weight:800}
.hbar .sub{font-size:11.5px;color:#9FB2BD;letter-spacing:.04em;margin-top:1px}
.hbar .right{margin-left:auto;text-align:right;font-family:var(--mono);font-size:11px;color:#9FB2BD}
.progress{height:5px;background:#2B3A44}
.progress > i{display:block;height:100%;background:var(--amber);width:0;transition:width .3s}

/* ---------- Barra inferior ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--steel);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #2B3A44
}
nav.tabs button{
  background:none;border:0;color:#8FA3AF;padding:9px 4px 10px;font-family:var(--display);
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px
}
nav.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}
nav.tabs button.on{color:var(--amber)}

/* ---------- Bloques ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.card.tight{padding:10px}
h2.sec{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:800}
.eyebrow{font-family:var(--display);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted);margin:10px 0 4px;text-transform:uppercase}
input,select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;
  font-size:16px;font-family:inherit;color:var(--ink)
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber)}
textarea{min-height:70px;resize:vertical}
.mono{font-family:var(--mono)}
input.mono{letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}

/* ---------- Botones ---------- */
button.btn{
  font-family:var(--display);font-size:13px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;
  padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer
}
button.btn.primary{background:var(--amber);border-color:var(--amber);color:#241503}
button.btn.dark{background:var(--steel);border-color:var(--steel);color:#fff}
button.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
button.btn.ghost{background:transparent}
button.btn.sm{padding:8px 10px;font-size:11.5px}
button.btn:disabled{opacity:.45}
button.btn.wide{width:100%}
.btnrow{display:flex;gap:8px}
.btnrow > *{flex:1}

/* ---------- Chips / estados ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;
  font-weight:700;cursor:pointer;white-space:nowrap
}
.chip.on{background:var(--steel);border-color:var(--steel);color:#fff}
.chip .n{font-family:var(--mono);opacity:.7;margin-left:4px}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-size:10.5px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:4px;border:1px solid}
.t-pend{background:#EEF0EC;border-color:#D3D8D2;color:#5B676F}
.t-enc{background:var(--ok-soft);border-color:#B7DDCD;color:var(--ok)}
.t-falt{background:var(--bad-soft);border-color:#F0C4C0;color:var(--bad)}
.t-exc{background:var(--amber-soft);border-color:#F2D9A8;color:#8A5300}

/* ---------- Lista de equipos ---------- */
.item{
  background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);
  border-radius:var(--r);padding:11px 12px;margin-bottom:8px;cursor:pointer;display:block;width:100%;text-align:left
}
.item.pendiente{border-left-color:#B9C1BA}
.item.encontrado{border-left-color:var(--ok)}
.item.faltante{border-left-color:var(--bad)}
.item.excedente{border-left-color:var(--amber)}
.item .niv{font-family:var(--mono);font-size:14.5px;font-weight:700;letter-spacing:.04em;word-break:break-all}
.item .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.item .foot{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.count{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* ---------- Ficha (pantalla completa) ---------- */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto;display:none}
.sheet.open{display:block}
.sheet-head{position:sticky;top:0;background:var(--steel);color:#fff;z-index:5}
.sheet-head .hbar h1{font-size:13px}
.sheet-body{max-width:600px;margin:0 auto;padding:0 12px 120px}
.sheet-foot{
  position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:61
}
.sheet-foot .inner{max-width:600px;margin:0 auto;display:flex;gap:8px}
.sheet-foot .inner > *{flex:1}

/* ---------- Fotos ---------- */
.angles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.angle{
  border:1px dashed var(--line);border-radius:8px;background:var(--panel2);padding:8px 6px;text-align:center;
  cursor:pointer;position:relative;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px
}
.angle.has{border-style:solid;border-color:var(--ok);background:#fff}
.angle .lbl{font-size:11px;font-weight:700;line-height:1.2;color:var(--muted)}
.angle.has .lbl{color:var(--ink)}
.angle .badge{position:absolute;top:-7px;right:-7px;background:var(--ok);color:#fff;font-family:var(--mono);
  font-size:11px;font-weight:700;border-radius:999px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.angle img{width:100%;height:52px;object-fit:cover;border-radius:5px}
.angle svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.6}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.thumb{position:relative}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.visor{position:fixed;inset:0;background:#0B1116;z-index:300;display:flex;flex-direction:column}
.visor-top{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;font-size:12.5px;
  background:var(--steel);padding-top:calc(12px + env(safe-area-inset-top))}
.visor-top span{flex:1;font-family:var(--mono)}
.visor-top button{background:none;border:1px solid #3A4A55;color:#fff;border-radius:6px;width:34px;height:34px;font-size:16px;cursor:pointer}
.visor-img{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px}
.visor-img img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.visor-img img.zoom{max-width:none;max-height:none;width:260%;object-fit:none;cursor:zoom-out}
.visor-pie{color:#8FA3AF;font-size:12px;text-align:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
.thumb img{cursor:zoom-in}
.thumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:999px;border:0;
  background:var(--bad);color:#fff;font-size:13px;line-height:1;cursor:pointer}

/* ---------- Adicionales ---------- */
.add-row{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--panel2)}
.add-row .top{display:flex;align-items:center;gap:8px}
.add-row .nom{font-weight:700;font-size:14px}
.add-row .qty{font-family:var(--mono);font-weight:700;background:var(--steel);color:#fff;border-radius:5px;padding:2px 7px;font-size:13px}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.stepper button{width:42px;height:42px;border:0;background:#fff;font-size:20px;cursor:pointer;color:var(--ink)}
.stepper input{width:56px;border:0;text-align:center;font-family:var(--mono);font-weight:700;padding:0}

/* ---------- Varios ---------- */
.banner{border-radius:var(--r);padding:11px 12px;font-size:13px;margin:12px 0;border:1px solid}
.b-warn{background:var(--amber-soft);border-color:#F0D9AC;color:#7A4A00}
.b-info{background:#E9EFF2;border-color:#CBDAE1;color:#2C4551}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 4px}
.kpi b{display:block;font-family:var(--mono);font-size:19px;line-height:1.1}
.kpi span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--steel);color:#fff;
  padding:11px 16px;border-radius:8px;font-size:13.5px;z-index:200;max-width:92%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.hidden{display:none!important}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
table.mini td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.mini td:last-child{text-align:right;font-family:var(--mono);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="tape"></div>
  <div class="hbar">
    <div>
      <h1>Levantamiento de patio</h1>
      <div class="sub" id="hSub">Sin sesión activa</div>
    </div>
    <div class="right"><span id="hCount"></span><br><span id="hSync" style="font-size:10px"></span></div>
  </div>
  <div class="progress"><i id="hBar"></i></div>
</header>

<main class="wrap">
  <div id="view-equipos"></div>
  <div id="view-sueltos" class="hidden"></div>
  <div id="view-reporte" class="hidden"></div>
  <div id="view-sesion" class="hidden"></div>
</main>

<nav class="tabs">
  <button data-tab="equipos" class="on"><svg viewBox="0 0 24 24"><path d="M2 16V7h11v9M13 10h4l3 3v3M2 16h2m5 0h6m4 0h1"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>Equipos</button>
  <button data-tab="sueltos"><svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="5"/><circle cx="8" cy="12" r="1.6"/><path d="M15 8h5M15 12h5M15 16h5"/></svg>Sueltos</button>
  <button data-tab="reporte"><svg viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>Reporte</button>
  <button data-tab="sesion"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10l2 2M19 5l-2 2M7 17l-2 2"/></svg>Sesión</button>
</nav>

<!-- Ficha de equipo -->
<section class="sheet" id="sheetEquipo">
  <div class="sheet-head">
    <div class="tape"></div>
    <div class="hbar">
      <button class="btn sm ghost" style="color:#fff;border-color:#3A4A55" onclick="cerrarFicha()">← Volver</button>
      <div class="sp"></div>
      <div class="right" id="fichaTag"></div>
    </div>
  </div>
  <div class="sheet-body" id="fichaBody"></div>
  <div class="sheet-foot"><div class="inner">
    <button class="btn bad" id="btnFaltante" onclick="marcarFaltante()">No localizado</button>
    <button class="btn ok" onclick="guardarFicha(true)">Confirmar en patio</button>
  </div></div>
</section>

<!-- Ficha de adicional suelto -->
<section class="sheet" id="sheetSuelto">
  <div class="sheet-head">
    <div class="tape"></div>
    <div class="hbar">
      <button class="btn sm ghost" style="color:#fff;border-color:#3A4A55" onclick="cerrarSuelto()">← Volver</button>
      <div class="sp"></div>
      <div class="right">Adicional suelto</div>
    </div>
  </div>
  <div class="sheet-body" id="sueltoBody"></div>
  <div class="sheet-foot"><div class="inner">
    <button class="btn ghost" onclick="borrarSuelto()">Eliminar</button>
    <button class="btn ok" onclick="guardarSuelto()">Guardar y cerrar</button>
  </div></div>
</section>

<input type="file" id="fileFoto" accept="image/*" capture="environment" multiple class="hidden">
<input type="file" id="fileGaleria" accept="image/*" multiple class="hidden">
<input type="file" id="fileExcel" accept=".xlsx,.xlsm,.xls,.csv" class="hidden">
<input type="file" id="fileJson" accept=".json" class="hidden">

<script>
/* =====================================================================
   LEVANTAMIENTO DE INVENTARIO EN PATIO — HT Rent
   App móvil offline (PWA). Datos en IndexedDB del dispositivo.
   ===================================================================== */

/* ------------------------- CATÁLOGOS EDITABLES ---------------------- */
const APP_VERSION = 'v26 · 4 sep 2026 · nube';

const CAT = {
  patios: ["Patio HT (Monterrey)","Patio JJ (Monterrey)","Monterrey - Forza","Monterrey - Tractomundo",
           "Aligar Manzanillo","JJ Manzanillo","Delfín Manzanillo","Lázaro Cárdenas",
           "JJ Veracruz","Fernández Veracruz","JJ Altamira"],
  tipos: [],    // se llenan con la columna PRODUCTO de tu Excel
  marcas: [],   // se llenan con la columna MARCA de tu Excel
  estatusFisico: ["Operativo","Requiere reparación menor","Requiere reparación mayor","Siniestrado","Fuera de operación"],
  condiciones: ["Nuevo","Usado - Bueno","Usado - Regular","Usado - Malo","Chatarra"],
  unidades: ["Pieza","Juego","Par","Metro","Kg"],
  adicionales: ["Llantas","Eje retráctil","Winches","Concha","Eje","Portallantas","Antibicicletas","Caja de Herramientas","Alerones"],
  angulos: ["Frontal","Lateral izquierdo","Lateral derecho","Trasera","NIV grabado","Placas",
            "Piso / plataforma","Ejes y suspensión","Llantas","Adicionales","Daños","Otra"],
  motivosFaltante: ["No se encontró en patio","Entregado a cliente","En tránsito / salió del patio",
                    "En taller externo","Ubicación distinta a la del listado","Otro"],
  angulosSuelto: ["Vista general","Lateral","Etiqueta / medida","Estado de desgaste","Lote completo","Otra"]
};

/* Catálogos que se aprenden del archivo y de lo que capturas en patio */
const CAT_APRENDIDOS = ['tipos','marcas','patios'];   // los adicionales son lista fija
function guardarCatalogos(){
  const v = {}; CAT_APRENDIDOS.forEach(k=>v[k]=CAT[k]); return store.put('kv',{k:'catalogos', v});
}
function recordar(lista, valor){
  const v = String(valor||'').trim(); if(!v) return;
  if(!CAT[lista].some(x=>norm(x)===norm(v))){ CAT[lista].push(v); CAT[lista].sort((a,b)=>a.localeCompare(b,'es')); guardarCatalogos(); }
}
function aprenderDelArchivo(filas){
  const frec = campo => {
    const m = new Map();
    filas.forEach(r=>{ const v=(r[campo]||'').trim(); if(!v) return;
      const k=norm(v); if(!m.has(k)) m.set(k,{txt:v,n:0}); m.get(k).n++; });
    return Array.from(m.values()).sort((a,b)=>b.n-a.n).map(x=>x.txt);
  };
  CAT.tipos  = frec('tipo');
  CAT.marcas = frec('marca');
  frec('ubicacion').forEach(u=>{ if(!CAT.patios.some(p=>norm(p)===norm(u))) CAT.patios.push(u); });
  guardarCatalogos();
}

/* ------------------------------ UTILS ------------------------------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); }));
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]/g," ").replace(/\s+/g," ").trim();
const hoy = () => new Date().toISOString().slice(0,10);
const stamp = () => new Date().toLocaleString('es-MX',{hour12:false});
let cajaProg = null;
function progreso(texto, sub){
  if(!cajaProg){
    cajaProg = document.createElement('div');
    cajaProg.className = 'toast';
    cajaProg.style.cssText += 'bottom:96px;min-width:80%;padding:14px 16px;text-align:left';
    document.body.appendChild(cajaProg);
  }
  cajaProg.innerHTML = `<b>${esc(texto)}</b>${sub?`<br><span style="opacity:.8;font-size:12.5px">${esc(sub)}</span>`:''}`;
}
function cerrarProgreso(){ if(cajaProg){ cajaProg.remove(); cajaProg = null; } }

function preguntar(texto, aceptar='Continuar'){
  return new Promise(res=>{
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(11,17,22,.75);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px';
    ov.innerHTML = `<div style="background:var(--panel);border-radius:12px;max-width:420px;width:100%;padding:18px">
      <div style="font-size:14.5px;line-height:1.5;white-space:pre-line">${esc(texto)}</div>
      <div class="btnrow" style="margin-top:16px">
        <button class="btn ghost" data-no>Cancelar</button>
        <button class="btn primary" data-si>${esc(aceptar)}</button>
      </div></div>`;
    ov.querySelector('[data-no]').onclick = ()=>{ ov.remove(); res(false); };
    ov.querySelector('[data-si]').onclick = ()=>{ ov.remove(); res(true); };
    document.body.appendChild(ov);
  });
}

function toast(msg, ms=2400){
  const t = document.createElement('div'); t.className='toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), ms);
}
function opciones(arr, sel){
  const lista = (sel && !arr.some(v=>norm(v)===norm(sel))) ? [sel, ...arr] : arr;   // nunca perder un valor que ya venía capturado
  return lista.map(v=>`<option value="${esc(v)}"${norm(v)===norm(sel)?' selected':''}>${esc(v)}</option>`).join('');
}
/* Campo libre con sugerencias: respeta la nomenclatura del inventario y admite capturar una nueva */
function sugerido(id, lista, valor, ph){
  return `<input id="${id}" list="dl_${id}" value="${esc(valor)}" placeholder="${esc(ph||'')}" autocomplete="off">
    <datalist id="dl_${id}">${lista.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;
}

/* ------------------------- ALMACENAMIENTO --------------------------- */
const STORES = ['kv','equipos','sueltos','fotos'];
let DB = null, MEM = null;

function abrirDB(){
  return new Promise(res=>{
    let ok = false;
    try{
      const req = indexedDB.open('ht_levantamiento_patio', 1);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains('kv'))      d.createObjectStore('kv',{keyPath:'k'});
        if(!d.objectStoreNames.contains('equipos')) d.createObjectStore('equipos',{keyPath:'id'});
        if(!d.objectStoreNames.contains('sueltos')) d.createObjectStore('sueltos',{keyPath:'id'});
        if(!d.objectStoreNames.contains('fotos'))   d.createObjectStore('fotos',{keyPath:'id'});
      };
      req.onsuccess = e => { ok=true; DB = e.target.result; res(true); };
      req.onerror   = () => { if(!ok){ MEM = memoria(); res(false); } };
      setTimeout(()=>{ if(!ok && !DB){ MEM = memoria(); res(false); } }, 2500);
    }catch(err){ MEM = memoria(); res(false); }
  });
}
function memoria(){ const m={}; STORES.forEach(s=>m[s]=new Map()); return m; }

const store = {
  put(s, obj){
    if(MEM){ MEM[s].set(obj.id ?? obj.k, obj); return Promise.resolve(); }
    return new Promise((res,rej)=>{ const t=DB.transaction(s,'readwrite'); t.objectStore(s).put(obj); t.oncomplete=res; t.onerror=rej; });
  },
  del(s, k){
    if(MEM){ MEM[s].delete(k); return Promise.resolve(); }
    return new Promise((res,rej)=>{ const t=DB.transaction(s,'readwrite'); t.objectStore(s).delete(k); t.oncomplete=res; t.onerror=rej; });
  },
  all(s){
    if(MEM) return Promise.resolve(Array.from(MEM[s].values()));
    return new Promise((res,rej)=>{ const r=DB.transaction(s,'readonly').objectStore(s).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=rej; });
  },
  get(s, k){
    if(MEM) return Promise.resolve(MEM[s].get(k));
    return new Promise((res,rej)=>{ const r=DB.transaction(s,'readonly').objectStore(s).get(k); r.onsuccess=()=>res(r.result); r.onerror=rej; });
  },
  clear(s){
    if(MEM){ MEM[s].clear(); return Promise.resolve(); }
    return new Promise((res,rej)=>{ const t=DB.transaction(s,'readwrite'); t.objectStore(s).clear(); t.oncomplete=res; t.onerror=rej; });
  }
};

async function crearEquipoParaFotos(ref){
  const fs = S.fotos.filter(f=>f.refId===ref);
  const e = nuevoEquipo({
    origen:'manual', estado:'excedente',
    patioFisico: patioPorDefecto(),
    capturadoPor: usuarioActual(), ts: stamp()
  });
  S.equipos.push(e);
  await store.put('equipos', e);
  for(const f of fs){
    const rec = await store.get('fotos', f.id);
    if(rec){ rec.refId = e.id; rec.ruta = ''; rec.dirty = true; await store.put('fotos', rec); }
    f.refId = e.id; f.ruta = ''; f.externa = false;
  }
  ASIGNANDO = null; BUSCA_ASIG = '';
  toast(`${fs.length} fotos enganchadas. Captura el NIV y el patio.`, 5000);
  abrirFicha(e.id);
}

async function asignarHuerfanas(ref, equipoId){
  const fs = S.fotos.filter(f=>f.refId===ref);
  for(const f of fs){
    const rec = await store.get('fotos', f.id);
    if(rec){ rec.refId = equipoId; rec.ruta = ''; rec.dirty = true; await store.put('fotos', rec); }
    f.refId = equipoId; f.ruta = ''; f.externa = false;
  }
  ASIGNANDO = null; BUSCA_ASIG = '';
  const e = S.equipos.find(x=>x.id===equipoId);
  render(); toast(`${fs.length} fotos asignadas a ${e?e.niv:'el equipo'}`, 4000);
  sincronizar();
}
async function borrarHuerfanas(ref){
  const fs = S.fotos.filter(f=>f.refId===ref);
  if(!confirm(`Se eliminan ${fs.length} fotos de este dispositivo. ¿Continuar?`)) return;
  for(const f of fs) await store.del('fotos', f.id);
  S.fotos = S.fotos.filter(f=>f.refId!==ref);
  render(); toast('Fotos eliminadas');
}

async function cerrarFicha(){
  const e = leerCampos();

    if(e.origen==='manual' && vacio){ S.equipos = S.equipos.filter(x=>x.id!==e.id); await store.del('equipos', e.id); }
    else await putEquipo(e);

  $('#sheetEquipo').classList.remove('open'); document.body.style.overflow='';

}

/* Los patios salen del propio levantamiento: nada de texto libre que
   termine escrito de tres formas distintas. */
let PATIOS_EXTRA = [];
function patiosDelLevantamiento(){
  const set = new Set(PATIOS_EXTRA);
  S.equipos.forEach(e=>{ if(e.patioFisico) set.add(e.patioFisico); });
  S.equipos.forEach(e=>{ const u = e.padron && e.padron.ubicacion; if(u) set.add(u); });
  if(S.sesion && S.sesion.patio) S.sesion.patio.split(' + ').forEach(p=>{ if(p.trim()) set.add(p.trim()); });
  return [...set].sort((a,b)=>a.localeCompare(b,'es'));
}
function patioPorDefecto(){
  const ps = patiosDelLevantamiento();
  if(ps.length === 1) return ps[0];
  if(S.filtroPatio && ps.includes(S.filtroPatio)) return S.filtroPatio;   // el que estás trabajando
  return '';
}
function opcionesPatio(sel){
  const ps = patiosDelLevantamiento();
  const lista = (sel && !ps.some(p=>norm(p)===norm(sel))) ? [sel, ...ps] : ps;
  return `<option value="">— Seleccionar —</option>` +
    lista.map(p=>`<option value="${esc(p)}"${norm(p)===norm(sel)?' selected':''}>${esc(p)}</option>`).join('') +
    `<option value="__otro__">+ Otro patio…</option>`;
}
async function otroPatio(idSelect){
  const v = (prompt('Nombre del patio, tal como lo manejan en el inventario:') || '').trim();
  const el = $('#'+idSelect);
  if(!v){ el.value = ''; return; }
  if(!PATIOS_EXTRA.some(p=>norm(p)===norm(v)) && !patiosDelLevantamiento().some(p=>norm(p)===norm(v))){
    PATIOS_EXTRA.push(v);
    await store.put('kv',{k:'patiosExtra', v:PATIOS_EXTRA});
  }
  el.innerHTML = opcionesPatio(v);
  el.value = v;
}

/* Para equipos cuyo NIV no se puede leer en patio: se registra con folio
   provisional para no perder las fotos ni el hallazgo. */
function sinNivLegible(){
  const usados = S.equipos.map(e=>norm(e.niv)).filter(v=>v.startsWith('SIN NIV'));
  let n = 1;
  while(usados.includes(norm('SIN-NIV-'+String(n).padStart(3,'0')))) n++;
  const folio = 'SIN-NIV-' + String(n).padStart(3,'0');
  $('#fNiv').value = folio;
  const obs = $('#fObs');
  if(obs && !obs.value.includes('NIV')) obs.value = (obs.value ? obs.value+' · ' : '') + 'NIV ilegible en patio, pendiente de identificar';
  $('#fNivAviso').innerHTML = `<div class="hint" style="color:var(--warn)">Queda como ${folio}. Cuando lo identifiquen, corrige el NIV aquí mismo.</div>`;
}

function leerCampos(){
  const e = fichaActual(); if(!e || !$('#fNiv')) return e;
  e.niv=$('#fNiv').value.trim(); e.placas=$('#fPlacas').value.trim().toUpperCase();

  e.anio=$('#fAnio').value.trim(); e.ejes=$('#fEjes').value.trim(); e.medidaLlantas=$('#fMedida').value.trim();

  const vp = $('#fPatio').value; e.patioFisico = (vp==='__otro__') ? e.patioFisico : vp;
  e.capturadoPor = usuarioActual() || e.capturadoPor;
  e.estatusFisico=$('#fEstFis').value; e.obs=$('#fObs').value.trim();
  if($('#fMotivo')) e.motivoFaltante=$('#fMotivo').value;

function persistirFicha(){ const e=fichaActual(); if(e) putEquipo(e); }

async function guardarFicha(cerrar){
  const e = leerCampos(); if(!e) return;
  if(cerrar){
    if(!e.niv){ toast('Captura el NIV del equipo'); return; }
    if(e.estado!=='faltante'){ e.estado = (e.origen==='padron') ? 'encontrado' : 'excedente'; e.ts = stamp(); }
  }

async function borrarEquipo(){
  const e = fichaActual(); if(!e) return;
  if(!confirm('¿Eliminar este equipo y sus fotos?')) return;
  for(const f of fotosDe(e.id)) await store.del('fotos', f.id);
  S.fotos = S.fotos.filter(f=>f.refId!==e.id);
  await store.del('equipos', e.id);
  S.equipos = S.equipos.filter(x=>x.id!==e.id);
  $('#sheetEquipo').classList.remove('open'); document.body.style.overflow=''; S.fichaId=null; render();

function tomarGPS(){
  if(!navigator.geolocation){ toast('Sin GPS disponible'); return; }
  toast('Obteniendo ubicación…');
  navigator.geolocation.getCurrentPosition(p=>{
    const e=fichaActual(); e.gps={lat:p.coords.latitude,lng:p.coords.longitude};
    $('#gpsTxt').textContent = `${e.gps.lat.toFixed(5)}, ${e.gps.lng.toFixed(5)}`; persistirFicha();
  }, ()=>toast('No se pudo obtener la ubicación'), {enableHighAccuracy:true, timeout:9000});

/* ============================== FOTOS =============================== */
let fotoDestino = null; // {refId, refTipo, angulo}
function botonAngulo(refId, ang){
  const n = S.fotos.filter(f=>f.refId===refId && f.angulo===ang).length;
  const ult = S.fotos.filter(f=>f.refId===refId && f.angulo===ang).slice(-1)[0];
  return `<div class="angle ${n?'has':''}" onclick="pedirFoto('${refId}','${ang}')">
    ${n?`<span class="badge">${n}</span>`:''}
    ${ult && ult.thumb ? `<img src="${ult.thumb}" alt="">` : ult ? `<span class="lbl" style="font-size:16px">🖼️</span>`
      : `<svg viewBox="0 0 24 24"><path d="M3 8h4l1.5-2h7L17 8h4v11H3z"/><circle cx="12" cy="13" r="3.4"/></svg>`}
    <span class="lbl">${esc(ang)}</span></div>`;
}
function pedirFoto(refId, ang){
  const refTipo = S.equipos.some(e=>e.id===refId) ? 'equipo' : 'suelto';
  fotoDestino = {refId, refTipo, angulo:ang};
  $('#fileFoto').value=''; $('#fileFoto').click();
}
async function recibirImagenes(ev){
  const files = Array.from(ev.target.files||[]); if(!files.length || !fotoDestino) return;
  toast('Procesando foto…');
  for(const file of files){
    try{
      const {blob, thumb} = await comprimir(file);
      const rec = {id:uid(), refId:fotoDestino.refId, refTipo:fotoDestino.refTipo, angulo:fotoDestino.angulo,
                   nombre:'', thumb, blob, disp: usuarioActual(), ts:stamp(), dirty:true, ruta:''};
      await store.put('fotos', rec);
      pedirSync();
      S.fotos.push({id:rec.id, refId:rec.refId, refTipo:rec.refTipo, angulo:rec.angulo, thumb, disp:rec.disp, ts:rec.ts});
    }catch(err){ toast('No se pudo procesar una imagen'); }
  }
  refrescarFotos();
}
$('#fileFoto').onchange = recibirImagenes;
$('#fileGaleria').onchange = recibirImagenes;
/* Fotos que ya existían: las manda el patio en resguardo, no se toman aquí */
function pedirGaleria(refId, idSelect){
  const refTipo = S.equipos.some(e=>e.id===refId) ? 'equipo' : 'suelto';

}
function refrescarFotos(){
  if(S.fichaId){
    const e = fichaActual();
    const cont = $('#fichaBody .angles'); if(cont) cont.innerHTML = CAT.angulos.map(a=>botonAngulo(e.id,a)).join('');
    const th = $('#thumbsEq'); if(th) th.innerHTML = pintarThumbs(e.id);
  }
  if(S.sueltoId){
    const cont = $('#sueltoBody .angles'); if(cont) cont.innerHTML = CAT.angulosSuelto.map(a=>botonAngulo(S.sueltoId,a)).join('');
    const th = $('#thumbsSu'); if(th) th.innerHTML = pintarThumbs(S.sueltoId);
  }
}
function pintarThumbs(refId){
  const fs = fotosDe(refId);
  if(!fs.length) return '';
  return fs.map(f=> f.thumb
    ? `<div class="thumb"><img src="${f.thumb}" alt="${esc(f.angulo)}" onclick="verFoto('${f.id}')"><button onclick="borrarFoto('${f.id}')">✕</button></div>`
    : `<div class="thumb" style="border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;aspect-ratio:1;font-size:11px;color:var(--muted);text-align:center;padding:4px;cursor:zoom-in" onclick="verFoto('${f.id}')">Ver foto de ${esc(f.disp||'otro')}</div>`
  ).join('');
}
/* Visor a tamaño completo: la imagen guardada es de 1440 px, ahí sí se lee el NIV */
async function verFoto(id){
  const rec = await store.get('fotos', id);
  let src = null, url = null;
  if(rec && rec.blob){ url = URL.createObjectURL(rec.blob); src = url; }
  else if(rec && rec.ruta && SB && SESION_NUBE && navigator.onLine){
    toast('Bajando la imagen…');
    try{
      const { data } = await SB.storage.from(NUBE.bucket).download(rec.ruta);
      if(data){ url = URL.createObjectURL(data); src = url; }
    }catch(e){}
  }
  if(!src){ toast('No se pudo abrir la imagen'); return; }
  const ov = document.createElement('div');
  ov.className = 'visor';
  ov.innerHTML = `<div class="visor-top"><span>${esc(rec.angulo||'')} · ${esc(rec.ts||'')}${rec.disp?' · '+esc(rec.disp):''}</span>
      <button aria-label="Cerrar">✕</button></div>
    <div class="visor-img"><img src="${src}" alt="${esc(rec.angulo||'')}"></div>
    <div class="visor-pie">Toca la imagen para acercar</div>`;
  const cerrar = () => { ov.remove(); if(url) URL.revokeObjectURL(url); };
  ov.querySelector('button').onclick = cerrar;
  ov.querySelector('img').onclick = function(){ this.classList.toggle('zoom'); };
  document.body.appendChild(ov);
}

async function borrarFoto(id){
  await store.del('fotos', id); S.fotos = S.fotos.filter(f=>f.id!==id); refrescarFotos();
}
function comprimir(file, max=1440, q=0.72){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const r = Math.min(1, max/Math.max(img.width,img.height));
      const w = Math.round(img.width*r), h = Math.round(img.height*r);
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      const tv = document.createElement('canvas'); const tr = Math.min(1,220/Math.max(w,h));
      tv.width=Math.round(w*tr); tv.height=Math.round(h*tr);
      tv.getContext('2d').drawImage(cv,0,0,tv.width,tv.height);
      const thumb = tv.toDataURL('image/jpeg',0.6);
      cv.toBlob(b=>{ URL.revokeObjectURL(url); b?res({blob:b, thumb}):rej(); }, 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

/* ==================== CARGA DEL PADRÓN DESDE EXCEL =================== */
const CDN = {
  xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  jszip:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'
};
function cargarLib(url, global){
  if(window[global]) return Promise.resolve(true);
  return new Promise(res=>{
    const s=document.createElement('script'); s.src=url;
    s.onload=()=>res(true); s.onerror=()=>res(false); document.head.appendChild(s);
  });
}
const ALIAS = {
  niv:['NIV','VIN','SERIE','NUMERO DE SERIE','NO DE SERIE','N SERIE'],
  tipo:['PRODUCTO','TIPO','TIPO DE EQUIPO','DESCRIPCION','EQUIPO'],
  marca:['MARCA'], anio:['ANO','ANIO','AÑO','MODELO ANO'],
  placas:['PLACAS','PLACA'], ejes:['EJES','N EJES','NO EJES','NUM EJES','NUMERO DE EJES'],
  medidaLlantas:['LLANTAS','MEDIDA LLANTA','MEDIDA DE LLANTA'],
  ejeRetractil:['EJE RETRACTIL'], ubicacion:['UBICACION','PATIO','LOCALIDAD','PLAZA'],
  cliente:['CLIENTE','ARRENDATARIO'],
  estatusAsignacion:['ESTATUS DE ASIGNACION','ESTATUS ASIGNACION'],
  estatusEntrega:['ESTATUS DE ENTREGA','ESTATUS ENTREGA']
};
let PADRON_TMP = null, UBIC_SEL = new Set(), COND_COL = null, REGLAS = {};

$('#fileExcel').onchange = async ev => {
  const file = ev.target.files[0]; if(!file) return;
  const ok = await cargarLib(CDN.xlsx,'XLSX');
  if(!ok){ toast('Sin conexión para leer Excel. Conéctate una vez y vuelve a intentar.'); return; }
  toast('Leyendo archivo…');
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf,{type:'array'});
    let hoja = wb.SheetNames.find(n=>norm(n)==='INV') || null;
    let datos = null;
    for(const nombre of (hoja?[hoja]:wb.SheetNames)){
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[nombre],{header:1,raw:false,defval:''});
      const r = detectarEncabezado(aoa);
      if(r>=0){ datos = mapear(aoa, r); break; }
    }
    if(!datos || !datos.length){ toast('No encontré una columna NIV en el archivo'); return; }
    PADRON_TMP = datos;
    UBIC_SEL = new Set(); COND_COL = null; REGLAS = {};
    aprenderDelArchivo(datos);
    mostrarSelectorUbicacion();
  }catch(err){ console.error(err); toast('No se pudo leer el archivo'); }
  ev.target.value='';
};
function detectarEncabezado(aoa){
  for(let i=0;i<Math.min(20,aoa.length);i++){
    const fila = (aoa[i]||[]).map(norm);
    if(fila.some(c=>ALIAS.niv.includes(c))) return i;
  }
  return -1;
}
let PADRON_COLS = [];
function mapear(aoa, r){
  const crudos = (aoa[r]||[]).map(h=>String(h||'').trim());
  const heads = crudos.map(norm);
  PADRON_COLS = crudos.filter(Boolean);
  const idx = {};
  for(const [campo, alias] of Object.entries(ALIAS)){
    idx[campo] = heads.findIndex(h=>alias.includes(h));
    if(idx[campo]<0) idx[campo] = heads.findIndex(h=>h && alias.some(a=>h.includes(a)));
  }
  const out = [];
  for(let i=r+1;i<aoa.length;i++){
    const f = aoa[i]||[]; const val = k => idx[k]>=0 ? String(f[idx[k]]??'').trim() : '';
    const niv = val('niv'); if(!niv || niv.length<6) continue;
    out.push({niv:niv.toUpperCase(), tipo:val('tipo'), marca:val('marca'),
      anio:val('anio'), placas:val('placas'), ejes:val('ejes'),
      medidaLlantas:val('medidaLlantas'), ejeRetractil:val('ejeRetractil'), ubicacion:val('ubicacion'),
      cliente:val('cliente'), estatusAsignacion:val('estatusAsignacion'), estatusEntrega:val('estatusEntrega'),
      extra: Object.fromEntries(crudos.map((h,j)=>[h, String(f[j]??'').trim()]).filter(([h])=>h))});
  }
  return out;
}
function mostrarSelectorUbicacion(){
  const grupos = {};
  PADRON_TMP.forEach(r=>{ const u = r.ubicacion || '(sin ubicación)'; grupos[u]=(grupos[u]||0)+1; });
  const lista = Object.entries(grupos).sort((a,b)=>b[1]-a[1]);
  const sel = lista.filter(([u])=>UBIC_SEL.has(u)).reduce((s,[,n])=>s+n,0);
  $('#padronInfo').innerHTML = `
    <div class="banner b-info"><b>${PADRON_TMP.length}</b> equipos leídos. <b>Paso 1:</b> marca los patios de la visita. Puedes elegir varios.</div>
    <div class="chips">${lista.map(([u,n])=>`<button class="chip ${UBIC_SEL.has(u)?'on':''}" onclick="togglePatio(${JSON.stringify(u).replace(/"/g,'&quot;')})">${esc(u)}<span class="n">${n}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:10px">
      <button class="btn sm ghost" onclick="todosLosPatios()">${UBIC_SEL.size===lista.length?'Quitar todos':'Marcar todos'}</button>

    </div>`;
}
function togglePatio(u){ UBIC_SEL.has(u) ? UBIC_SEL.delete(u) : UBIC_SEL.add(u); mostrarSelectorUbicacion(); }
function todosLosPatios(){
  const todos = new Set(PADRON_TMP.map(r=>r.ubicacion||'(sin ubicación)'));
  UBIC_SEL = UBIC_SEL.size===todos.size ? new Set() : todos;
  mostrarSelectorUbicacion();
}
const etiquetaEstatus = r => (r.estatusEntrega||'').trim() || '(sin estatus)';
const etiquetaClase = r => (COND_COL && r.extra ? (r.extra[COND_COL]||'').trim() : '') || '(sin dato)';
const COL_CLASE = 'NUEVO O USADO';   // columna E del inventario
const PISTAS_CLASE = ['NUEVO O USADO','CONDICION','CLASIFIC','SEMINUEVO','TIPO DE UNIDAD','CATEGORIA','ESTATUS DE UNIDAD'];
/* ---- Reglas por patio: cada patio lleva sus propios criterios ------- */
const filasDePatio = p => PADRON_TMP.filter(r => (r.ubicacion||'(sin ubicación)') === p);
const filasUbicacion = () => UBIC_SEL.size ? PADRON_TMP.filter(r=>UBIC_SEL.has(r.ubicacion||'(sin ubicación)')) : PADRON_TMP;
const etiquetaMarca = r => (r.marca||'').trim() || '(sin marca)';
const CAMPOS = {
  estatus: {titulo:'Estatus de entrega', valor: r=>etiquetaEstatus(r)},
  clase:   {titulo:'Nuevo o usado',      valor: r=>etiquetaClase(r)},
  marca:   {titulo:'Marca',              valor: r=>etiquetaMarca(r)}
};
const reglaVacia = () => ({estatus:[], clase:[], marca:[]});

function pasoEstatus(){
  if(COND_COL===null){
    COND_COL = PADRON_COLS.find(h=>norm(h)===COL_CLASE)
            || PADRON_COLS.find(h=>PISTAS_CLASE.some(p=>norm(h).includes(p))) || '';
  }
  for(const p of UBIC_SEL){
    if(REGLAS[p]) continue;
    const pend = [...new Set(filasDePatio(p).map(etiquetaEstatus))].filter(k=>norm(k).includes('PENDIENTE'));
    REGLAS[p] = {todo:false, reglas:[Object.assign(reglaVacia(), {estatus:pend})]};
  }
  for(const p of Object.keys(REGLAS)) if(!UBIC_SEL.has(p)) delete REGLAS[p];
  pintarReglas();
}
function coincide(r, regla){
  return Object.keys(CAMPOS).every(k => !regla[k].length || regla[k].includes(CAMPOS[k].valor(r)));
}
function filasSeleccionadasDe(p){
  const cfg = REGLAS[p]; if(!cfg) return [];
  const filas = filasDePatio(p);
  return cfg.todo ? filas : filas.filter(r=>cfg.reglas.some(g=>coincide(r,g)));
}
function pintarReglas(){
  const patios = [...UBIC_SEL];
  const total = patios.reduce((n,p)=>n+filasSeleccionadasDe(p).length, 0);
  $('#padronInfo').innerHTML = `
    <div class="banner b-info"><b>Paso 2:</b> qué vas a contabilizar en cada patio.
      Dentro de un patio puedes armar varias reglas: un equipo entra si cumple <b>alguna</b> de ellas.</div>
    ${COND_COL ? `<p class="hint">Nuevo o usado se lee de la columna <b>${esc(COND_COL)}</b>.
      <select onchange="cambiarColumnaClase(this.value)" style="margin-top:6px">
        <option value="">— Sin columna de nuevo/usado —</option>
        ${PADRON_COLS.map(h=>`<option value="${esc(h)}"${h===COND_COL?' selected':''}>${esc(h)}</option>`).join('')}
      </select></p>` : ''}
    ${patios.map(bloquePatio).join('')}
    <div class="row" style="margin-top:12px">
      <button class="btn sm ghost" onclick="mostrarSelectorUbicacion()">← Cambiar patios</button>
      <div class="sp"></div>
      ${LEV ? '' : `<button class="btn primary sm" onclick="importarSeleccion()" ${total?'':'disabled'}>Cargar ${total} aquí</button>`}
    </div>
    <button class="btn ghost wide sm" style="margin-top:8px" onclick="guardarSeleccionExcel()" ${total?'':'disabled'}>Guardar esta selección en Excel</button>
    <p class="hint">Genera un archivo con solo esos ${total} equipos y todas las columnas del original. La próxima vez cargas ese archivo y ya no filtras nada.</p>
    ${SESION_NUBE ? `<button class="btn dark wide sm" style="margin-top:8px" onclick="crearLevantamientoNube()" ${total?'':'disabled'}>Crear levantamiento nuevo (${total})</button>
      ${LEV?`<button class="btn primary wide sm" style="margin-top:6px" onclick="agregarAlLevantamiento()" ${total?'':'disabled'}>Agregar estos ${total} al levantamiento activo</button>
        <p class="hint">Suma tu lista a <b>${esc(LEV_NOMBRE||'el levantamiento en uso')}</b>, saltando los NIV que ya estén. Así varios pueden cargar patios distintos y terminar en un solo reporte.</p>`
      :`<p class="hint">Sube la lista a Supabase: los demás celulares la ven al iniciar sesión, sin pasar por GitHub.</p>`}`
    : `<button class="btn dark wide sm" style="margin-top:8px" onclick="publicarParaCelular()" ${total?'':'disabled'}>Generar padron.json para el celular (${total})</button>
      <p class="hint">Descarga el archivo, súbelo a la raíz del repositorio y al abrir la liga en el celular la lista se carga sola.</p>`}`;
}
async function guardarSeleccionExcel(){
  const ok = await cargarLib(CDN.xlsx,'XLSX'); if(!ok){ toast('Sin conexión para generar Excel'); return; }

function bloquePatio(p){
  const cfg = REGLAS[p], filas = filasDePatio(p), n = filasSeleccionadasDe(p).length;
  return `<div class="card" style="margin:12px 0">
    <div class="row">
      <b style="font-size:15px">${esc(p)}</b><div class="sp"></div>
      <span class="tag ${n?'t-enc':'t-pend'}">${n} de ${filas.length}</span>
    </div>
    <div class="chips" style="margin-top:8px">
      <button class="chip ${cfg.todo?'on':''}" onclick="patioTodo(${JSON.stringify(p).replace(/"/g,'&quot;')})">Todo el patio</button>
      <button class="chip ${cfg.todo?'':'on'}" onclick="patioFiltrar(${JSON.stringify(p).replace(/"/g,'&quot;')})">Con reglas</button>
    </div>
    ${cfg.todo ? `<p class="hint">Entra todo lo que el sistema tiene en este patio, sin importar estatus, marca ni condición.</p>`
      : cfg.reglas.map((g,i)=>bloqueRegla(p,g,i)).join('') +
        `<button class="btn ghost wide sm" style="margin-top:8px" onclick="agregarRegla(${JSON.stringify(p).replace(/"/g,'&quot;')})">+ Otra regla en este patio</button>`}
  </div>`;
}
function bloqueRegla(p, g, i){
  const filas = filasDePatio(p);
  const grupo = campo => {
    const m = {};
    filas.forEach(r=>{ const k = CAMPOS[campo].valor(r); m[k]=(m[k]||0)+1; });
    const lista = Object.entries(m).sort((a,b)=>b[1]-a[1]);
    if(campo==='clase' && !COND_COL) return '';
    return `<div style="margin-top:8px"><div class="eyebrow">${CAMPOS[campo].titulo}</div>
      <div class="chips" style="margin-top:4px">${lista.map(([k,c])=>
        `<button class="chip ${g[campo].includes(k)?'on':''}" onclick="toggleRegla(${JSON.stringify(p).replace(/"/g,'&quot;')},${i},'${campo}',${JSON.stringify(k).replace(/"/g,'&quot;')})">${esc(k)}<span class="n">${c}</span></button>`).join('')}</div></div>`;
  };
  const cuantos = filas.filter(r=>coincide(r,g)).length;
  return `<div class="add-row" style="margin-top:8px">
    <div class="row"><span class="eyebrow">Regla ${i+1}</span><div class="sp"></div>
      <span class="count">${cuantos} equipos</span>
      ${REGLAS[p].reglas.length>1?`<button class="btn sm ghost" onclick="quitarRegla(${JSON.stringify(p).replace(/"/g,'&quot;')},${i})">✕</button>`:''}
    </div>
    ${grupo('estatus')}${grupo('clase')}${grupo('marca')}
    <p class="hint">Lo que dejes sin marcar en un renglón significa «cualquiera».</p>
  </div>`;
}
function patioTodo(p){ REGLAS[p].todo = true; pintarReglas(); }
function patioFiltrar(p){ REGLAS[p].todo = false; pintarReglas(); }
function agregarRegla(p){ REGLAS[p].reglas.push(reglaVacia()); pintarReglas(); }
function quitarRegla(p,i){ REGLAS[p].reglas.splice(i,1); pintarReglas(); }
function toggleRegla(p,i,campo,valor){
  const arr = REGLAS[p].reglas[i][campo];
  const j = arr.indexOf(valor);
  j>=0 ? arr.splice(j,1) : arr.push(valor);
  pintarReglas();
}
function cambiarColumnaClase(h){
  COND_COL = h;
  Object.values(REGLAS).forEach(cfg=>cfg.reglas.forEach(g=>g.clase=[]));
  pintarReglas();
}
async function importarSeleccion(){
  if(!PADRON_TMP) return;
  const filas = seleccionActual();
  const n = await importarFilas(filas, textoCriterio(), COND_COL);
  if(S.sesion && UBIC_SEL.size){ S.sesion.patio = [...UBIC_SEL].join(' + '); await guardarSesion(); }
  PADRON_TMP = null; UBIC_SEL = new Set(); COND_COL = null; REGLAS = {};
  render(); toast(`${n} equipos cargados a la lista`);
}
function seleccionActual(){
  const out = [];
  for(const p of UBIC_SEL) out.push(...filasSeleccionadasDe(p));
  return out;
}
function textoCriterio(){
  return [...UBIC_SEL].map(p=>{
    const cfg = REGLAS[p];
    if(!cfg) return p;
    if(cfg.todo) return `${p}: todo`;
    const reglas = cfg.reglas.map(g=>{
      const partes = Object.keys(CAMPOS).filter(k=>g[k].length).map(k=>`${CAMPOS[k].titulo.toLowerCase()} ${g[k].join('/')}`);
      return partes.length ? partes.join(' + ') : 'todo';
    });
    return `${p}: ${reglas.join(' | ')}`;
  }).join('  ·  ');
}
/* Genera el archivo que se sube al repositorio para que el celular lo tome solo */
function publicarParaCelular(){
  const filas = seleccionActual();
  if(!filas.length){ toast('No hay equipos seleccionados'); return; }
  const paquete = {
    generado: new Date().toISOString(),
    patio: [...UBIC_SEL].join(' + ') || 'Todas las ubicaciones',
    criterio: textoCriterio(),
    filas, clase: COND_COL
  };
  bajar(new Blob([JSON.stringify(paquete)],{type:'application/json'}), 'padron.json');
  toast('padron.json descargado — súbelo al repositorio');
}
async function importarFilas(filas, criterio, colClase){
  const existentes = new Set(S.equipos.map(e=>norm(e.niv)).filter(Boolean));
  let nuevos = 0;
  for(const r of filas){
    if(existentes.has(norm(r.niv))) continue;
    const e = nuevoEquipo({
      origen:'padron', estado:'pendiente', niv:r.niv, tipo:r.tipo, marca:r.marca,
      anio:r.anio, placas:r.placas, ejes:r.ejes, medidaLlantas:r.medidaLlantas,
      patioFisico: r.ubicacion||'', clasificacion: (colClase && r.extra ? (r.extra[colClase]||'') : ''),
      capturadoPor: usuarioActual(), padron:r
    });
    if(r.ejeRetractil && /^(S|SI|X|1)$/.test(norm(r.ejeRetractil)))
      e.adicionales.push({tipo:'Eje retráctil', cantidad:1, marcaMedida:'', condicion:'Usado - Bueno', obs:'Según listado'});
    S.equipos.push(e); await putEquipo(e); nuevos++; existentes.add(norm(r.niv));
  }
  if(S.sesion && criterio){ S.sesion.criterio = criterio; await guardarSesion(); }
  S.equipos.sort((a,b)=>(a.niv||'').localeCompare(b.niv||''));
  return nuevos;
}

async function limpiarPadron(){
  if(!confirm('Se quitan los equipos del listado que sigan sin revisar. ¿Continuar?')) return;
  const quitar = S.equipos.filter(e=>e.origen==='padron' && e.estado==='pendiente');
  for(const e of quitar) await store.del('equipos', e.id);
  S.equipos = S.equipos.filter(e=>!(e.origen==='padron' && e.estado==='pendiente'));
  render(); toast('Listado sin revisar eliminado');
}

/* ============ PADRÓN PUBLICADO (carga hecha en la computadora) ======= */
let PUB = null;   // paquete disponible que aún no se importa
async function buscarPadronPublicado(){
  try{
    const r = await fetch('padron.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const paquete = await r.json();
    if(!paquete || !Array.isArray(paquete.filas) || !paquete.filas.length) return;
    const marca = await store.get('kv','padronPublicado');
    if(marca && marca.v === paquete.generado) return;          // ya se había cargado este
    if(!S.equipos.length){
      if(!S.sesion){ S.sesion = {patio: paquete.patio||'', fecha: hoy(), notas:'', criterio:''}; await guardarSesion(); }
      const n = await importarFilas(paquete.filas, paquete.criterio, paquete.clase);
      await store.put('kv',{k:'padronPublicado', v:paquete.generado});
      S.tab = USUARIO ? 'equipos' : 'sesion';
      render();
      toast(`${n} equipos cargados desde la computadora`, 4000);
    } else {
      PUB = paquete; render();
    }
  }catch(e){ /* sin conexión o sin archivo publicado: se sigue normal */ }
}
async function aceptarPublicado(){
  if(!PUB) return;
  const n = await importarFilas(PUB.filas, PUB.criterio, PUB.clase);

/* Deja temporalmente en S solo lo del patio elegido, para que el reporte
   y el ZIP salgan de un patio sin tocar el resto del código. */
let RESPALDO_REP = null;
function aplicarFiltroReporte(){
  if(!S.repPatio && !S.repCap) return;
  RESPALDO_REP = {eq:S.equipos, su:S.sueltos, fo:S.fotos};
  const okPatio = p => !S.repPatio || (p||'(sin patio)')===S.repPatio;
  const okCap   = c => !S.repCap   || (c||'(sin capturista)')===S.repCap;
  S.equipos = RESPALDO_REP.eq.filter(e=>okPatio(e.patioFisico) && (e.estado==='pendiente' ? !S.repCap : okCap(e.capturadoPor)));
  S.sueltos = RESPALDO_REP.su.filter(x=>okPatio(x.patio) && okCap(x.capturadoPor));
  const ids = new Set([...S.equipos.map(e=>e.id), ...S.sueltos.map(x=>x.id)]);
  S.fotos = RESPALDO_REP.fo.filter(f=>ids.has(f.refId) && (!S.repCap || (f.disp||'(sin capturista)')===S.repCap));
}
function quitarFiltroReporte(){
  if(!RESPALDO_REP) return;
  S.equipos = RESPALDO_REP.eq; S.sueltos = RESPALDO_REP.su; S.fotos = RESPALDO_REP.fo;
  RESPALDO_REP = null;
}
function chipsReporte(){
  const gP = {}; S.equipos.forEach(e=>{ const k=e.patioFisico||'(sin patio)'; gP[k]=(gP[k]||0)+1; });
  const gC = {}; S.equipos.filter(e=>e.estado!=='pendiente').forEach(e=>{ const k=e.capturadoPor||'(sin capturista)'; gC[k]=(gC[k]||0)+1; });
  const patios = Object.entries(gP).sort((a,b)=>b[1]-a[1]);
  const caps   = Object.entries(gC).sort((a,b)=>b[1]-a[1]);
  if(patios.length<2 && caps.length<2) return '';
  return `<div class="card tight"><div class="eyebrow" style="margin-bottom:6px">Alcance del reporte</div>
    ${patios.length>1?`<div class="chips">
      <button class="chip ${S.repPatio?'':'on'}" onclick="setRepPatio('')">Todos los patios</button>
      ${patios.map(([p,n])=>`<button class="chip ${S.repPatio===p?'on':''}" onclick="setRepPatio(${JSON.stringify(p).replace(/"/g,'&quot;')})">${esc(p)}<span class="n">${n}</span></button>`).join('')}
    </div>`:''}
    ${caps.length>1?`<div class="chips" style="margin-top:8px">
      <button class="chip ${S.repCap?'':'on'}" onclick="setRepCap('')">Todos los capturistas</button>
      ${caps.map(([c,n])=>`<button class="chip ${S.repCap===c?'on':''}" onclick="setRepCap(${JSON.stringify(c).replace(/"/g,'&quot;')})">${esc(c)}<span class="n">${n}</span></button>`).join('')}
    </div>`:''}
    <p class="hint">Puedes entregar un patio terminado sin esperar a los demás, o sacar solo lo que levantó una persona. Lo que descargues sale de lo marcado.
      ${S.repCap?'<br>Con un capturista marcado no se incluyen los equipos que nadie ha revisado.':''}</p></div>`;
}
function setRepPatio(p){ S.repPatio = p; vistaReporte(); }
function setRepCap(c){ S.repCap = c; vistaReporte(); }

/* Está físicamente en un patio distinto al que dice el inventario */
function movido(e){
  const sis = (e.padron && e.padron.ubicacion) || '';
  return e.origen==='padron' && e.estado!=='pendiente' && e.estado!=='faltante'
      && sis && e.patioFisico && norm(sis) !== norm(e.patioFisico);
}
const limpio = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 _.-]/g,'').replace(/\s+/g,'_').slice(0,60);
function nombreArchivo(f){
  const e = S.equipos.find(x=>x.id===f.refId), s = S.sueltos.find(x=>x.id===f.refId);
  const base = e ? (e.niv || 'SIN_NIV') : (s ? limpio(s.tipo) : 'FOTO');
  const n = S.fotos.filter(x=>x.refId===f.refId && x.angulo===f.angulo).findIndex(x=>x.id===f.id)+1;
  return `${limpio(base)}_${limpio(f.angulo)}_${n}.jpg`;
}

/* ------------------------ DESCARGAR FOTOS ZIP ----------------------- */
async function descargarFotos(){
  if(!S.fotos.length){ toast('Todavía no hay fotos'); return; }
  try{ await armarZipFotos(); }
  catch(err){ cerrarProgreso(); quitarFiltroReporte(); toast('Falló el ZIP: '+((err&&err.message)||'error desconocido'), 7000); }
}
async function armarZipFotos(){
  const ok = await cargarLib(CDN.jszip,'JSZip');
  if(!ok){ toast('Necesitas conexión una vez para habilitar el ZIP'); return; }
  aplicarFiltroReporte();
  const zip = new JSZip();
  progreso('Preparando el ZIP…');
  const locales = new Map((await store.all('fotos')).map(f=>[f.id,f]));
  const todas = []; let faltan = 0;
  let i = 0;
  for(const f of S.fotos){
    i++;
    const rec = locales.get(f.id) || f;
    if(rec.blob){ todas.push(rec); continue; }
    const ruta = rec.ruta || f.ruta;
    if(SB && SESION_NUBE && ruta && navigator.onLine){
      progreso(`Bajando fotos de la nube… ${i} de ${S.fotos.length}`, 'No cierres esta pestaña');
      try{
        const { data } = await SB.storage.from(NUBE.bucket).download(ruta);
        if(data){ todas.push(Object.assign({}, f, {blob:data})); continue; }
      }catch(e){}
    }
    faltan++;
  }
  if(!todas.length){
    cerrarProgreso();
    toast('No se pudo obtener ninguna foto. Revisa la conexión y que hayas iniciado sesión en la nube.', 6000);
    quitarFiltroReporte(); return;
  }
  const ajenas = faltan;
  const patio = limpio(S.sesion?S.sesion.patio:'');
  for(const f of todas){
    const e = S.equipos.find(x=>x.id===f.refId), s = S.sueltos.find(x=>x.id===f.refId);
    let carpeta;
    if(e) carpeta = `${limpio(e.patioFisico||patio)}/${limpio(e.niv||'SIN_NIV')} - ${limpio(e.tipo||'SIN TIPO')}`;
    else  carpeta = `_ADICIONALES SUELTOS/${limpio((s&&s.tipo)||'OTROS')}`;
    zip.folder(carpeta).file(nombreArchivo(f), f.blob);
  }
  progreso('Comprimiendo…', `${todas.length} fotos`);
  const blob = await zip.generateAsync({type:'blob'}, m => {
    if(m.percent % 5 < 1) progreso('Comprimiendo…', `${Math.round(m.percent)}%`);
  });
  cerrarProgreso();
  bajar(blob, `Fotos_${limpio(S.repPatio)||patio}${S.repCap?'_'+limpio(S.repCap):''}_${S.sesion?S.sesion.fecha:hoy()}.zip`);
  quitarFiltroReporte();
  const mb = (blob.size/1048576).toFixed(1);
  toast(ajenas
    ? `ZIP de ${todas.length} fotos (${mb} MB) en tu carpeta de Descargas. Faltaron ${ajenas}: revisa la conexión y vuelve a exportar.`
    : `ZIP de ${todas.length} fotos (${mb} MB) en tu carpeta de Descargas.`, 8000);
}
function bajar(blob, nombre){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
}

/* ------------------------ RESPALDO / MERGE -------------------------- */
function exportarJSON(){
  const data = {version:1, exportado:stamp(), sesion:S.sesion, equipos:S.equipos, sueltos:S.sueltos,

$('#fileJson').onchange = async ev => {

    const idsEq = new Set(S.equipos.map(e=>e.id)), nivs = new Set(S.equipos.map(e=>norm(e.niv)).filter(Boolean));

    for(const e of (d.equipos||[])){
      if(idsEq.has(e.id)) continue;
      if(e.niv && nivs.has(norm(e.niv))){
        const local = S.equipos.find(x=>norm(x.niv)===norm(e.niv));

    }

    for(const s of (d.sueltos||[])){ if(idsSu.has(s.id)) continue; S.sueltos.push(s); await store.put('sueltos', s); n++; }
    const idsFo = new Set(S.fotos.map(f=>f.id));

const pendientes = () =>

  if(SYNC.corriendo){ SYNC.pendiente = true; return; }

    await subirEquipos();
    await subirSueltos();
    await subirFotos();
    await bajarCambios();
    SYNC.ultimo = stamp();
    SYNC.error = SYNC.fallos.length ? resumenFallos() : '';
  }catch(err){
    const m = (err && err.message) || '';
    SYNC.error = m.includes('levantamiento_id_fkey')
      ? 'El levantamiento al que apunta este dispositivo ya no existe en la nube. Abajo, en la lista, usa «Mover mis capturas a este levantamiento». No uses «Usar»: eso borra lo de este aparato.'
      : m.includes('Failed to fetch')
        ? 'Se cortó la conexión a media subida. Con señal estable vuelve a darle Sincronizar; lo que falta sigue guardado aquí.'
        : (m || 'Falló la sincronización');
  }
  SYNC.corriendo = false; pintarNube(); pintarHeader();
  if(SYNC.pendiente){ SYNC.pendiente = false; setTimeout(()=>sincronizar(), 800); }
}
const uidUser = () => SESION_NUBE ? SESION_NUBE.user.id : null;

/* Si un equipo ya existe en el servidor con otro id (por haberlo cargado
   también en local), adoptamos el id del servidor en vez de insertar duplicado. */
async function reconciliarIds(){
  const sucios = S.equipos.filter(e=>e.dirty && e.niv);
  if(!sucios.length) return;
  const nivs = [...new Set(sucios.map(e=>e.niv))];
  for(let i=0;i<nivs.length;i+=200){
    const { data, error } = await SB.from('equipos').select('id,niv')
      .eq('levantamiento_id', LEV).in('niv', nivs.slice(i,i+200));
    if(error) throw error;
    for(const row of (data||[])){
      const local = sucios.find(e=>e.niv===row.niv && e.id!==row.id);
      if(!local) continue;
      const viejo = local.id;
      if(S.equipos.some(e=>e.id===row.id)){          // ya lo tengo bajado: el local sobra
        for(const f of S.fotos.filter(f=>f.refId===viejo)){   // sus fotos pasan al bueno
          const rec = await store.get('fotos', f.id);
          if(rec){ rec.refId = row.id; await store.put('fotos', rec); }
          f.refId = row.id;
        }
        S.equipos = S.equipos.filter(e=>e.id!==viejo);
        await store.del('equipos', viejo);
        continue;
      }
      await store.del('equipos', viejo);
      local.id = row.id;
      await store.put('equipos', local);
      for(const f of S.fotos.filter(f=>f.refId===viejo)){
        const rec = await store.get('fotos', f.id);
        if(rec){ rec.refId = row.id; await store.put('fotos', rec); }
        f.refId = row.id;
      }
    }
  }
}
async function subirEquipos(){
  await reconciliarIds();
  const sucios = S.equipos.filter(e=>e.dirty && e.niv);
  for(let i=0;i<sucios.length;i+=100){
    const lote = sucios.slice(i,i+100).map(e=>({
      id:e.id, levantamiento_id:LEV, niv:e.niv, origen:e.origen, estado:e.estado,
      patio:e.patioFisico||'', clasificacion:e.clasificacion||'', tipo:e.tipo, marca:e.marca, anio:e.anio,
      placas:e.placas, ejes:e.ejes, medida_llantas:e.medidaLlantas, zona:e.zona,
      estatus_fisico:e.estatusFisico, motivo_faltante:e.motivoFaltante, obs:e.obs,
      adicionales:e.adicionales, gps:e.gps, padron:e.padron,
      capturado_por:e.capturadoPor||USUARIO, capturado_uid:uidUser()
    }));
    const grupo = sucios.slice(i,i+100);
    const { error } = await SB.from('equipos').upsert(lote, {onConflict:'id'});
    if(!error){
      for(const e of grupo){ e.dirty = false; await store.put('equipos', e); }
      continue;
    }
    if((error.message||'').includes('Failed to fetch')) throw error;      // sin red: mejor parar
    for(let j=0;j<grupo.length;j++){                                       // uno por uno para aislar el malo
      const { error: e1 } = await SB.from('equipos').upsert([lote[j]], {onConflict:'id'});
      if(e1){ SYNC.fallos.push('equipo ' + (grupo[j].niv||'sin NIV')); continue; }
      grupo[j].dirty = false; await store.put('equipos', grupo[j]);
    }
  }
}
async function subirSueltos(){
  S.sueltos.filter(x=>x.dirty && !x.tipo).forEach(()=>SYNC.fallos.push('adicional suelto sin tipo'));
  const sucios = S.sueltos.filter(x=>x.dirty && x.tipo);
  for(const x of sucios){
    const { error } = await SB.from('sueltos').upsert({
      id:x.id, levantamiento_id:LEV, patio:x.patio||(S.sesion?S.sesion.patio:''), tipo:x.tipo,
      descripcion:x.descripcion, marca:x.marca, medida:x.medida, cantidad:x.cantidad, unidad:x.unidad,
      condicion:x.condicion, zona:x.zona, propietario:x.propietario, obs:x.obs,
      capturado_por:x.capturadoPor||USUARIO, capturado_uid:uidUser()
    }, {onConflict:'id'});
    if(error){
      if((error.message||'').includes('Failed to fetch')) throw error;
      SYNC.fallos.push('adicional ' + (x.tipo||'')); continue;
    }
    x.dirty = false; await store.put('sueltos', x);
  }
}
async function subirFotos(){
  const porSubir = S.fotos.filter(f=>!f.ruta && !f.externa);
  SYNC.subiendo = porSubir.length; pintarNube();
  for(const f of porSubir){
    const rec = await store.get('fotos', f.id);
    if(!rec || !rec.blob){ continue; }
    const padreEq = S.equipos.find(e=>e.id===f.refId);
    const padreSu = S.sueltos.find(x=>x.id===f.refId);
    if(!padreEq && !padreSu){ SYNC.fallos.push('foto sin equipo asociado'); SYNC.subiendo--; continue; }
    if((padreEq && (padreEq.dirty || !padreEq.niv)) || (padreSu && (padreSu.dirty || !padreSu.tipo))){
      SYNC.fallos.push('foto en espera de su registro'); SYNC.subiendo--; continue;   // se reintenta después
    }
    const ruta = `${LEV}/${f.refId}/${f.id}.jpg`;
    const { error } = await SB.storage.from(NUBE.bucket).upload(ruta, rec.blob, {contentType:'image/jpeg', upsert:true});
    if(error){
      if((error.message||'').includes('Failed to fetch')) throw error;
      SYNC.fallos.push('foto no subida'); SYNC.subiendo--; continue;
    }
    const { error: e2 } = await SB.from('fotos').upsert({
      id:f.id, levantamiento_id:LEV,
      equipo_id: padreEq ? f.refId : null, suelto_id: padreEq ? null : f.refId,
      angulo:f.angulo, ruta, capturado_por:f.disp||USUARIO, capturado_uid:uidUser()
    }, {onConflict:'id'});
    if(e2){
      if((e2.message||'').includes('Failed to fetch')) throw e2;
      SYNC.fallos.push('foto rechazada'); SYNC.subiendo--; continue;
    }
    rec.ruta = ruta; rec.dirty = false; await store.put('fotos', rec);
    f.ruta = ruta;
    SYNC.subiendo--; pintarNube();
  }
  SYNC.subiendo = 0;
}
async function bajarCambios(){
  const k = await store.get('kv','ultimoPull');
  const desde = (k && k.v) || null;
  const ahora = new Date().toISOString();

  let q = SB.from('equipos').select('*').eq('levantamiento_id', LEV);
  if(desde) q = q.gt('actualizado_en', desde);
  const { data: eqs, error } = await q;
  if(error) throw error;
  for(const r of (eqs||[])){
    const local = S.equipos.find(e=>e.id===r.id);
    if(local && local.dirty) continue;                       // lo mío aún no sube: no lo piso
    const e = nuevoEquipo({
      id:r.id, origen:r.origen, estado:r.estado, niv:r.niv, tipo:r.tipo, marca:r.marca, anio:r.anio,
      placas:r.placas, ejes:r.ejes, medidaLlantas:r.medida_llantas, patioFisico:r.patio,
      clasificacion:r.clasificacion, zona:r.zona, estatusFisico:r.estatus_fisico,
      motivoFaltante:r.motivo_faltante, obs:r.obs, adicionales:r.adicionales||[], gps:r.gps,
      padron:r.padron||{}, capturadoPor:r.capturado_por||'', ts:r.actualizado_en, dirty:false
    });
    if(local) Object.assign(local, e); else S.equipos.push(e);
    await store.put('equipos', local || e);
  }

  let qs = SB.from('sueltos').select('*').eq('levantamiento_id', LEV);
  if(desde) qs = qs.gt('actualizado_en', desde);
  const { data: sus } = await qs;
  for(const r of (sus||[])){
    const local = S.sueltos.find(x=>x.id===r.id);
    if(local && local.dirty) continue;
    const x = nuevoSuelto({id:r.id, tipo:r.tipo, descripcion:r.descripcion, marca:r.marca, medida:r.medida,
      cantidad:r.cantidad, unidad:r.unidad, condicion:r.condicion, zona:r.zona, patio:r.patio,
      propietario:r.propietario, obs:r.obs, capturadoPor:r.capturado_por||'', ts:r.actualizado_en, dirty:false});
    if(local) Object.assign(local, x); else S.sueltos.push(x);
    await store.put('sueltos', local || x);
  }

  let qf = SB.from('fotos').select('*').eq('levantamiento_id', LEV);
  if(desde) qf = qf.gt('creado_en', desde);
  const { data: fts } = await qf;
  for(const r of (fts||[])){
    if(S.fotos.some(f=>f.id===r.id)) continue;
    const rec = {id:r.id, refId:r.equipo_id||r.suelto_id, refTipo:r.equipo_id?'equipo':'suelto',
                 angulo:r.angulo, ruta:r.ruta, disp:r.capturado_por||'', externa:true, ts:r.creado_en};
    await store.put('fotos', rec); S.fotos.push(rec);
  }

  await store.put('kv',{k:'ultimoPull', v:ahora});
  S.equipos.sort((a,b)=>(a.niv||'').localeCompare(b.niv||''));
  render();
}

async function eliminarLevantamiento(){
  if(!SB || !SESION_NUBE || !LEV) return;
  const lev = LEVS.find(l=>l.id===LEV);
  if(!confirm(`Se borra de la nube "${lev?lev.nombre:'este levantamiento'}" con todos sus equipos, adicionales y fotos, para todos los que lo tengan. ¿Continuar?`)) return;
  if(!confirm('Última confirmación: no se puede deshacer.')) return;
  const { error } = await SB.from('levantamientos').delete().eq('id', LEV);
  if(error){ toast('No se pudo borrar: '+error.message, 5000); return; }
  for(const st of ['equipos','sueltos','fotos']) await store.clear(st);
  S.equipos=[]; S.sueltos=[]; S.fotos=[];
  await store.put('kv',{k:'ultimoPull', v:null});
  await store.put('kv',{k:'levId', v:null});
  LEV = null; LEV_NOMBRE = '';
  if(canal){ SB.removeChannel(canal); canal = null; }
  await listarLevantamientos();
  render(); toast('Levantamiento eliminado');
}
/* Rescate: pasa lo capturado en este dispositivo a otro levantamiento
   sin borrar nada. Sirve cuando el levantamiento original ya no existe. */
async function moverAqui(id){
  const l = LEVS.find(x=>x.id===id);
  const capturados = S.equipos.filter(e=>e.estado!=='pendiente');
  if(!(await preguntar(`Se pasan ${capturados.length} equipos capturados${S.sueltos.length?` y ${S.sueltos.length} adicionales sueltos`:''} a "${l?l.nombre:'este levantamiento'}".\n\nLos equipos que aún no revisas se descartan y se vuelve a bajar la lista buena.`, 'Mover'))) return;
  toast('Moviendo capturas…');

  const conservar = new Set(capturados.map(e=>e.id));
  for(const e of S.equipos) if(!conservar.has(e.id)) await store.del('equipos', e.id);
  S.equipos = capturados;
  for(const e of S.equipos){ e.dirty = true; await store.put('equipos', e); }
  for(const x of S.sueltos){ x.dirty = true; await store.put('sueltos', x); }

  const quedan = [];
  for(const f of S.fotos){
    const rec = await store.get('fotos', f.id);
    if(rec && rec.blob && conservar.has(rec.refId) || (rec && rec.blob && S.sueltos.some(x=>x.id===rec.refId))){
      rec.ruta = ''; rec.dirty = true; await store.put('fotos', rec);
      f.ruta = ''; f.externa = false; quedan.push(f);
    } else {
      await store.del('fotos', f.id);
    }
  }
  S.fotos = quedan;

  LEV = id; LEV_NOMBRE = l ? l.nombre : '';
  await store.put('kv',{k:'levId', v:id});
  await store.put('kv',{k:'levNombre', v:LEV_NOMBRE});
  await store.put('kv',{k:'ultimoPull', v:null});
  suscribirVivo();
  await sincronizar();
  render();
  toast(`Listo: ${capturados.length} capturas movidas`, 5000);
}

async function bajarTodo(){
  if(!SB || !SESION_NUBE || !LEV){ toast('Sin levantamiento activo'); return; }
  if(pendientes() && !(await preguntar(`Tienes ${pendientes()} registros sin subir. Se suben primero y luego se baja todo.`, 'Continuar'))) return;
  await store.put('kv',{k:'ultimoPull', v:null});
  toast('Descargando…');
  await sincronizar();
  toast(`${S.equipos.length} equipos en el dispositivo`, 4000);
}

/* ----------------------------- En vivo ------------------------------ */
let canal = null;
function suscribirVivo(){
  if(!SB || !LEV) return;
  if(canal){ SB.removeChannel(canal); canal = null; }
  canal = SB.channel('lev-'+LEV)
    .on('postgres_changes', {event:'*', schema:'patio', table:'equipos', filter:`levantamiento_id=eq.${LEV}`},
        ()=>{ clearTimeout(syncTimer); syncTimer = setTimeout(()=>sincronizar(), 1200); })
    .on('postgres_changes', {event:'*', schema:'patio', table:'sueltos', filter:`levantamiento_id=eq.${LEV}`},
        ()=>{ clearTimeout(syncTimer); syncTimer = setTimeout(()=>sincronizar(), 1200); })
    .subscribe();
}

/* --------------------------- Tarjeta Nube --------------------------- */
function tarjetaNube(){
  if(!SB) return `<div class="card"><div class="hint">Sin conexión con la nube. Al recuperar señal se conecta sola; mientras tanto puedes capturar todo aquí.</div></div>`;
  if(!SESION_NUBE) return `<div class="card">
    <label>Correo</label><input id="nCorreo" type="email" autocomplete="username" inputmode="email">
    <label>Contraseña</label><input id="nPass" type="password" autocomplete="current-password">
    <div style="height:10px"></div>
    <button class="btn primary wide" id="nBtn" onclick="entrarNube()">Entrar</button>
    <p class="hint">Sin iniciar sesión la app funciona igual, pero guarda solo en este celular.</p></div>`;
  const pend = pendientes();
  const lev = LEVS.find(l=>l.id===LEV);
  const nombreLev = lev ? lev.nombre : (LEV ? (LEV_NOMBRE || 'activo') : 'ninguno');
  return `<div class="card">
    <table class="mini">
      <tr><td>Sesión</td><td style="font-family:var(--body);font-weight:600">${esc(SESION_NUBE.user.email)}</td></tr>
      <tr><td>Levantamiento</td><td style="font-family:var(--body);font-weight:600">${esc(nombreLev)}</td></tr>
      <tr><td>Equipos descargados</td><td>${S.equipos.length}</td></tr>
      <tr><td>Sin subir</td><td>${pend}${pend?` <span style="font-family:var(--body);font-weight:400;font-size:11px">(${S.equipos.filter(e=>e.dirty).length} eq · ${S.sueltos.filter(x=>x.dirty).length} ad · ${S.fotos.filter(f=>!f.ruta && !f.externa).length} fotos)</span>`:''}</td></tr>
      <tr><td>Última sincronización</td><td style="font-family:var(--body)">${esc(SYNC.ultimo||'—')}</td></tr>
    </table>
    ${SYNC.error?`<div class="banner b-warn" style="margin-top:8px">${esc(SYNC.error)}</div>`:''}
    ${SYNC.corriendo?`<div class="hint" style="margin-top:8px">Sincronizando${SYNC.subiendo?` · ${SYNC.subiendo} fotos en camino`:''}…</div>`:''}
    <div class="btnrow" style="margin-top:10px">
      <button class="btn dark" onclick="sincronizar()" ${LEV?'':'disabled'}>Sincronizar ahora</button>
      <button class="btn ghost" onclick="salirNube()">Cerrar sesión</button>
    </div>
    ${LEV?`<button class="btn ghost wide sm" style="margin-top:8px" onclick="bajarTodo()">Volver a bajar todo del servidor</button>
`:''}
    <h2 class="sec">Levantamientos</h2>
    <div class="row" style="margin-bottom:6px">
      <button class="btn sm ghost" onclick="refrescarLevs()">Actualizar lista</button>
      <div class="sp"></div>
      <button class="btn sm ghost" onclick="VER_CERRADOS=!VER_CERRADOS;pintarNube()">${VER_CERRADOS?'Ocultar cerrados':'Ver cerrados'}</button>
    </div>
    ${listaLevs()}
    <p class="hint">Al cambiar de levantamiento se descarga lo que ya capturaron los demás. Cierra los que ya reportaste para que no te estorben.</p>
  </div>`;
}
let VER_CERRADOS = false;
function listaLevs(){
  const vis = LEVS.filter(l => VER_CERRADOS ? l.estado==='cerrado' : l.estado!=='cerrado');
  if(!vis.length) return `<div class="hint">${VER_CERRADOS?'No hay levantamientos cerrados.':'No hay levantamientos abiertos. Carga el Excel y crea uno.'}</div>`;
  return vis.slice(0,12).map(l=>`
    <div class="item ${l.id===LEV?'encontrado':'pendiente'}" style="cursor:default">
      <div class="row">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px">${esc(l.nombre)}</div>
          <div class="meta">${esc(l.fecha)}${l.id===LEV?' · en uso en este dispositivo':''}</div>
        </div>
        ${l.id===LEV ? `<span class="tag t-enc">Activo</span>`
          : `<button class="btn sm" onclick="usarLevantamiento('${l.id}', true)">Usar</button>`}
      </div>
      ${l.id!==LEV && pendientes() ? `<button class="btn primary sm wide" style="margin-top:6px" onclick="moverAqui('${l.id}')">Mover mis ${pendientes()} capturas a este levantamiento</button>` : ''}
      <div class="row" style="margin-top:6px">
        ${l.estado==='cerrado'
          ? `<button class="btn sm ghost" onclick="cambiarEstadoLev('${l.id}','abierto')">Reabrir</button>`
          : `<button class="btn sm ghost" onclick="cambiarEstadoLev('${l.id}','cerrado')">Cerrar</button>`}
        <button class="btn sm ghost" onclick="borrarLev('${l.id}')">Eliminar</button>
      </div>
    </div>`).join('');
}
async function refrescarLevs(){ await listarLevantamientos(); pintarNube(); toast('Lista actualizada'); }
async function cambiarEstadoLev(id, estado){
  const { error } = await SB.from('levantamientos').update({estado}).eq('id', id);
  if(error){ toast('No se pudo: '+error.message, 4000); return; }
  await listarLevantamientos(); pintarNube();
  toast(estado==='cerrado' ? 'Levantamiento cerrado' : 'Levantamiento reabierto');
}
async function borrarLev(id){
  const l = LEVS.find(x=>x.id===id);
  if(!(await preguntar(`Se borra de la nube "${l?l.nombre:'este levantamiento'}" con todos sus equipos, adicionales y fotos, para todos.`, 'Eliminar'))) return;
  if(!(await preguntar('Última confirmación: no se puede deshacer.', 'Sí, eliminar'))) return;
  const { error } = await SB.from('levantamientos').delete().eq('id', id);
  if(error){ toast('No se pudo borrar: '+error.message, 5000); return; }
  if(id === LEV){
    for(const st of ['equipos','sueltos','fotos']) await store.clear(st);
    S.equipos=[]; S.sueltos=[]; S.fotos=[];
    await store.put('kv',{k:'ultimoPull', v:null});
    await store.put('kv',{k:'levId', v:null});
    LEV = null; LEV_NOMBRE = '';
    if(canal){ SB.removeChannel(canal); canal = null; }
  }
  await listarLevantamientos(); render(); toast('Levantamiento eliminado');
}
function pintarNube(){
  const el = $('#nubeBox'); if(el) el.innerHTML = tarjetaNube();
  const ind = $('#hSync');
  if(ind){
    const pend = SB && SESION_NUBE && LEV ? pendientes() : 0;
    ind.textContent = !SESION_NUBE ? 'local' : SYNC.corriendo ? 'subiendo…' : pend ? `${pend} en cola` : 'al día';
    ind.style.color = !SESION_NUBE ? '#9FB2BD' : pend ? 'var(--amber)' : '#7FD1AE';
  }
}
window.addEventListener('online', ()=>{ toast('Conexión recuperada'); sincronizar(); });

</script>
